[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "strands-weather-forecaster"
version = "0.1.0"
description = "Strands Weather Forecaster example for agentverify"
requires-python = ">=3.10"
dependencies = [
    "strands-agents>=1.61",  # http_request is one of its vended tools (strands-agents-tools 0.9 dropped its own)
    "agentverify",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
py-modules = ["weather_agent"]

# Its own pytest config, so the repository's settings (which turn the agentverify plugin off
# for its own tests) do not apply and --cassette-mode works here.
[tool.pytest.ini_options]
testpaths = ["tests"]
