name: CI

on:
  push:
  pull_request:
  # Dependencies are unpinned, so a weekly run catches upstream releases that break agentverify
  # between pushes. GitHub runs scheduled workflows from the default branch only.
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

# The jobs only read the repository; Coveralls authenticates with the token's identity.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        pytest-version: [""]
        include:
          - python-version: "3.10"
            pytest-version: "7.*"
          - python-version: "3.12"
            pytest-version: "8.*"
          - python-version: "3.14"
            pytest-version: "9.*"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all,dev]"

      - name: Pin pytest version
        if: matrix.pytest-version != ''
        run: pip install "pytest==${{ matrix.pytest-version }}"

      - name: Run tests with coverage
        run: |
          python -m pytest tests/ --cov=agentverify --cov-report=term-missing --cov-branch -p no:agentverify

      - name: Upload coverage to Coveralls
        if: github.repository == 'simukappu/agentverify' && matrix.python-version == '3.14' && matrix.pytest-version == ''
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

  # The [all] extra pulls in litellm, which pins openai<3; current litellm also declares Python <3.15.
  # This job installs every other provider extra so it exercises openai 3.x and Python 3.15.
  # Coverage is gated in the test job; litellm-only tests skip here.
  compat-without-litellm:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14", "3.15"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[openai,anthropic,gemini,bedrock,dev]"

      - name: Run tests
        run: python -m pytest tests/ -p no:agentverify

  examples:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install agentverify and example dependencies
        run: |
          python -m pip install --upgrade pip
          # agentverify without [all]: the examples pull in the provider SDKs
          # they need, and openai-agents[litellm] picks a litellm that fits
          # its openai requirement.
          pip install -e ".[dev]"
          pip install -e "examples/strands-weather-forecaster[dev]"
          pip install -e "examples/langchain-issue-triage[dev]"
          pip install -e "examples/langgraph-multi-agent-supervisor[dev]"
          pip install -e "examples/openai-agents-llm-as-a-judge[dev]"
          pip install -e "examples/custom-converter-python-agent[dev]"
          pip install -e "examples/openai-agents-litellm-provider[dev]"

      - name: Run examples smoke tests
        run: python -m pytest examples/tests -v

      - name: Run strands-weather-forecaster tests
        run: python -m pytest examples/strands-weather-forecaster/tests -v

      - name: Run langchain-issue-triage tests
        run: python -m pytest examples/langchain-issue-triage/tests -v

      - name: Run langgraph-multi-agent-supervisor tests
        run: python -m pytest examples/langgraph-multi-agent-supervisor/tests -v

      - name: Run openai-agents-llm-as-a-judge tests
        run: python -m pytest examples/openai-agents-llm-as-a-judge/tests -v

      - name: Run custom-converter-python-agent tests
        run: python -m pytest examples/custom-converter-python-agent/tests -v

      - name: Run openai-agents-litellm-provider tests
        run: python -m pytest examples/openai-agents-litellm-provider/tests -v
